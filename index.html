    <!--
      THESIS: A section code is a fixed-position readout, not a label — so the app is a bench
      instrument that displays codes, and it refuses the tinted-blocks-on-a-panel scheduling
      dashboard every tool in this category ships.

      OWN-WORLD: Blackened steel in four steps, chamfered plates instead of rounded cards, 1px
      machined edges, engraved Archivo caps on nameplates, Martian Mono for every code and count.
      Nixie orange #FF6A00 is reserved for what is LIVE and nothing else; the eight departments
      glow as gas-discharge fills — neon, krypton, xenon, sodium, argon, mercury, white, helium.

      STORY: The student sees an instrument that has already done the conflict math, reads the
      lit codes off it, and types them into AISIS before the seats go.

      FIRST VIEWPORT: Setup rail left as a stacked plate stack; stage right. The pager count sits
      in a real tube bank — glass envelopes, unlit ghost behind each lit digit — above the week,
      whose blocks are chamfered modules each glowing in its department's gas.

      FORM: Nixie Counter (challenger, chosen over assigned index 6 "Tide Table"); seed 9a063065.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
